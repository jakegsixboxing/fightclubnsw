<style>

.roster-card,.profile-frame{border:2px solid var(--gold-dark);border-radius:16px;background:radial-gradient(ellipse at top, #1c1c1c 0%, #0d0d0d 72%);box-shadow:inset 0 0 0 1px rgba(201,162,39,.15), 0 6px 18px rgba(0,0,0,.45)}
.roster-card{display:block;color:inherit;padding:22px 20px}

.roster-name{font-family:'Oswald',sans-serif;font-size:1.3rem;font-weight:700;margin:0 0 2px;color:var(--cream)}

.roster-stat{text-align:center;border:1px solid #2a2a2a;border-radius:8px;padding:8px 4px;background:rgba(255,255,255,0.02)}
.roster-stat .n{display:block;font-family:'Oswald',sans-serif;font-size:1.3rem;color:var(--gold-bright)}

.profile-grid{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:start}

</style>

<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#/" data-link>
      <img src="/logo.png" alt="Fight Club Central Coast" class="brand-logo">
      <span class="brand-text">FIGHT <span class="brand-accent">CLUB</span></span>
    </a>
    <div class="profile-corner" id="pf-profile-corner"></div>
  </div>
</header>
<main class="wrap" id="app"><div class="spinner-msg">Loading…</div></main>
<footer class="site-footer">
  <div class="wrap">
    <img src="/logo.png" alt="Fight Club Central Coast" class="footer-logo">
    <p>Fight Club Central Coast &mdash; honest Central Coast boxing. Real records, fair fights.</p>
  </div>
</footer>
<nav class="bottom-tabs" id="pf-bottom-tabs"></nav>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ============================================================================
// Fight Club Central Coast — single-file client app.
// No build step, no framework. Supabase (Auth + Postgres w/ RLS + Storage)
// is the entire backend; this file only talks to Supabase directly.
// Naming convention: everything belonging to this app is prefixed `pf`.
// ============================================================================

const SUPABASE_URL = "https://xawlbpjquylkfmvrlfpo.supabase.co";
const SUPABASE_KEY = "sb_publishable_8FAabd5jdglwzPnFb7qPJw_vBCrkN9V";
const pfSupabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const PF_BUCKET = "pf-photos";
const PF_EVENT_TYPES = ["Amateur", "Pro-Am", "Professional"];
const PF_SEASON = "2026";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const pfState = {
  session: null,
  user: null,
  fighter: null,   // this user's own pf_fighters row, or null
  isAdmin: false,
  ready: false,
};

const pfApp = document.getElementById("app");
const pfProfileCornerEl = document.getElementById("pf-profile-corner");
const pfBottomTabsEl = document.getElementById("pf-bottom-tabs");

function pfEscape(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function pfFlash(message, kind = "error") {
  if (!message) return "";
  return `<div class="flash flash-${kind}">${pfEscape(message)}</div>`;
}

// ---------------------------------------------------------------------------
// Auth bootstrap
// ---------------------------------------------------------------------------
async function pfRefreshSession() {
  const { data } = await pfSupabase.auth.getSession();
  pfState.session = data.session;
  pfState.user = data.session ? data.session.user : null;

  if (pfState.user) {
    const [{ data: fighterRow }, { data: adminRow }] = await Promise.all([
      pfSupabase.from("pf_fighters").select("*").eq("user_id", pfState.user.id).maybeSingle(),
      pfSupabase.rpc("pf_is_admin"),
    ]);
    pfState.fighter = fighterRow || null;
    pfState.isAdmin = !!adminRow;
  } else {
    pfState.fighter = null;
    pfState.isAdmin = false;
  }
}

pfSupabase.auth.onAuthStateChange(async (_event, session) => {
  pfState.session = session;
  pfState.user = session ? session.user : null;
  await pfRefreshSession();
  pfRenderNav();
  pfRoute();
});

// ---------------------------------------------------------------------------
// Data access layer (pf_db.*) — mirrors the shape of the old lib/db.mjs, just
// running client-side against RLS-protected tables/views + RPCs instead of a
// service-role key.
// ---------------------------------------------------------------------------
const pfDb = {
  async weightDivisions(boxerType) {
    const { data, error } = await pfSupabase.from("pf_weight_divisions").select("*").eq("boxer_type", boxerType).order("sort_order");
    if (error) throw error;
    return data;
  },
  async weightDivisionsByType() {
    const [amateur, professional] = await Promise.all([pfDb.weightDivisions("amateur"), pfDb.weightDivisions("professional")]);
    return { amateur, professional };
  },
  async weightDivisionById(id) {
    if (id == null) return null;
    const { data } = await pfSupabase.from("pf_weight_divisions").select("*").eq("id", id).maybeSingle();
    return data || null;
  },
  async fighterById(id) {
    const { data } = await pfSupabase.from("pf_fighters_flat").select("*").eq("id", id).maybeSingle();
    return data || null;
  },
  async allFighters() {
    const { data, error } = await pfSupabase.from("pf_fighters_flat").select("*").order("created_at", { ascending: false });
    if (error) throw error;
    return data;
  },
  async fightersForPicker() {
    const { data, error } = await pfSupabase.from("pf_fighters_flat")
      .select("id, full_name, gym_name, boxer_type, wins, losses, draws, availability, division_label, division_name, division_type, division_sort")
      .order("division_type").order("division_sort").order("full_name");
    if (error) throw error;
    return data;
  },
  async createFighter(userId, record) {
    const { data, error } = await pfSupabase.from("pf_fighters").insert({ user_id: userId, ...record }).select("id").limit(1);
    if (error) throw error;
    return data[0].id;
  },
  async updateFighter(fighterId, record) {
    const { error } = await pfSupabase.from("pf_fighters").update({ ...record, updated_at: new Date().toISOString() }).eq("id", fighterId);
    if (error) throw error;
  },
  async setFighterPhoto(fighterId, url) {
    const { error } = await pfSupabase.from("pf_fighters").update({ photo_path: url }).eq("id", fighterId);
    if (error) throw error;
  },
  async events() {
    const { data, error } = await pfSupabase.from("pf_events_flat").select("*").order("event_date").order("created_at", { ascending: false });
    if (error) throw error;
    return data;
  },
  async eventById(id) {
    const { data } = await pfSupabase.from("pf_events_flat").select("*").eq("id", id).maybeSingle();
    return data || null;
  },
  async createEvent(e) {
    const { data, error } = await pfSupabase.from("pf_events").insert(e).select("id").limit(1);
    if (error) throw error;
    return data[0].id;
  },
  async setEventPhoto(eventId, url) {
    const { error } = await pfSupabase.from("pf_events").update({ photo_path: url }).eq("id", eventId);
    if (error) throw error;
  },
  async setEventVideo(eventId, url) {
    const { error } = await pfSupabase.from("pf_events").update({ video_path: url }).eq("id", eventId);
    if (error) throw error;
  },
  async nominate(eventId, fighterId) {
    const { error } = await pfSupabase.from("pf_nominations").upsert({ event_id: eventId, fighter_id: fighterId }, { onConflict: "event_id,fighter_id", ignoreDuplicates: true });
    if (error) throw error;
  },
  async withdrawNomination(eventId, fighterId) {
    const { error } = await pfSupabase.from("pf_nominations").delete().eq("event_id", eventId).eq("fighter_id", fighterId);
    if (error) throw error;
  },
  async hasNominated(eventId, fighterId) {
    const { count } = await pfSupabase.from("pf_nominations").select("id", { count: "exact", head: true }).eq("event_id", eventId).eq("fighter_id", fighterId);
    return (count || 0) > 0;
  },
  async nomineesForEvent(eventId) {
    const { data, error } = await pfSupabase.from("pf_nominations_flat").select("*").eq("nom_event_id", eventId).order("division_type").order("division_sort").order("full_name");
    if (error) throw error;
    return data;
  },
  async matchingPoolFighters() {
    const { data: nomRows, error } = await pfSupabase.from("pf_nominations").select("fighter_id, event_id");
    if (error) throw error;
    if (!nomRows.length) return [];
    const fighterIds = [...new Set(nomRows.map((r) => r.fighter_id))];
    const eventIds = [...new Set(nomRows.map((r) => r.event_id))];
    const [{ data: fighters }, { data: events }] = await Promise.all([
      pfSupabase.from("pf_fighters_flat").select("*").in("id", fighterIds),
      pfSupabase.from("pf_events").select("id, title").in("id", eventIds),
    ]);
    const eventTitleById = new Map((events || []).map((e) => [e.id, e.title]));
    const eventsByFighter = new Map();
    for (const r of nomRows) {
      const list = eventsByFighter.get(r.fighter_id) || [];
      const title = eventTitleById.get(r.event_id);
      if (title) list.push(title);
      eventsByFighter.set(r.fighter_id, list);
    }
    return (fighters || [])
      .map((f) => ({ ...f, nominated_events: eventsByFighter.get(f.id) || [] }))
      .sort((a, b) => {
        if ((a.division_type || "") !== (b.division_type || "")) return (a.division_type || "").localeCompare(b.division_type || "");
        if ((a.division_sort ?? 0) !== (b.division_sort ?? 0)) return (a.division_sort ?? 0) - (b.division_sort ?? 0);
        return String(a.full_name).localeCompare(String(b.full_name));
      });
  },
  async createMatch({ fighter_a_id, fighter_b_id, event_id, agreed_weight, note }) {
    const { data, error } = await pfSupabase.from("pf_matches").insert({
      fighter_a_id, fighter_b_id, event_id: event_id || null,
      proposed_by: pfState.user.id, agreed_weight: agreed_weight || null, note: note || null,
    }).select("id").limit(1);
    if (error) throw error;
    return data[0].id;
  },
  async allMatchesAdmin() {
    const { data, error } = await pfSupabase.from("pf_matches_flat").select("*").not("status", "in", "(cancelled,declined)");
    if (error) throw error;
    const order = { agreed: 0, proposed: 1, confirmed: 2 };
    return data.sort((a, b) => {
      const oa = order[a.status] ?? 3, ob = order[b.status] ?? 3;
      if (oa !== ob) return oa - ob;
      return new Date(b.updated_at) - new Date(a.updated_at);
    });
  },
  async pendingOffersForFighter(fighterId) {
    const { data, error } = await pfSupabase.from("pf_matches_flat").select("*").eq("status", "proposed")
      .or(`and(fighter_a_id.eq.${fighterId},a_response.eq.pending),and(fighter_b_id.eq.${fighterId},b_response.eq.pending)`)
      .order("created_at", { ascending: false });
    if (error) throw error;
    return data;
  },
  async boutsForFighter(fighterId) {
    const { data, error } = await pfSupabase.from("pf_matches_flat").select("*")
      .or(`fighter_a_id.eq.${fighterId},fighter_b_id.eq.${fighterId}`).in("status", ["agreed", "confirmed"]);
    if (error) throw error;
    return data.sort((a, b) => {
      if (a.status !== b.status) return a.status === "confirmed" ? 1 : -1;
      return new Date(b.updated_at) - new Date(a.updated_at);
    });
  },
  async confirmedMatchesForEvent(eventId) {
    const { data, error } = await pfSupabase.from("pf_matches_flat").select("*").eq("event_id", eventId).eq("status", "confirmed");
    if (error) throw error;
    return data.sort((a, b) => (a.a_division || "").localeCompare(b.a_division || ""));
  },
  async confirmedMatchesAll() {
    const { data, error } = await pfSupabase.from("pf_matches_flat").select("*").eq("status", "confirmed");
    if (error) throw error;
    return data.sort((a, b) => {
      const ad = a.event_date ? new Date(a.event_date) : new Date(8640000000000000);
      const bd = b.event_date ? new Date(b.event_date) : new Date(8640000000000000);
      if (ad - bd !== 0) return ad - bd;
      return new Date(b.updated_at) - new Date(a.updated_at);
    });
  },
  async respondToMatch(matchId, response) {
    const { error } = await pfSupabase.rpc("pf_respond_to_match", { p_match_id: matchId, p_response: response });
    if (error) throw error;
  },
  async confirmMatch(matchId, eventId) {
    const { error } = await pfSupabase.rpc("pf_confirm_match", { p_match_id: matchId, p_event_id: eventId || null });
    if (error) throw error;
  },
  async placeMatchOnEvent(matchId, eventId) {
    const { error } = await pfSupabase.from("pf_matches").update({ event_id: eventId || null, updated_at: new Date().toISOString() }).eq("id", matchId);
    if (error) throw error;
  },
  async cancelMatch(matchId) {
    const { error } = await pfSupabase.rpc("pf_cancel_match", { p_match_id: matchId });
    if (error) throw error;
  },
  async recordMatchResult({ matchId, winnerFighterId, method, fotnFighterId }) {
    const { error } = await pfSupabase.rpc("pf_record_match_result", {
      p_match_id: matchId, p_winner_fighter_id: winnerFighterId || null, p_method: method, p_fotn_fighter_id: fotnFighterId || null,
    });
    if (error) throw error;
  },
  async leaderboard(season) {
    const { data: results, error } = await pfSupabase.from("pf_results").select("*").eq("season", season || PF_SEASON);
    if (error) throw error;
    if (!results.length) return [];
    const byFighter = new Map();
    for (const r of results) {
      const agg = byFighter.get(r.fighter_id) || { points: 0, fights: 0, wins_season: 0, fotn_count: 0 };
      agg.points += r.points; agg.fights += 1;
      if (r.outcome === "win") agg.wins_season += 1;
      if (r.fighter_of_night) agg.fotn_count += 1;
      byFighter.set(r.fighter_id, agg);
    }
    const fighterIds = [...byFighter.keys()];
    const { data: fighters } = await pfSupabase.from("pf_fighters_flat").select("*").in("id", fighterIds);
    const byId = new Map((fighters || []).map((f) => [f.id, f]));
    const rows = fighterIds.map((id) => ({ ...byId.get(id), ...byFighter.get(id) })).filter((f) => f.id != null && f.points > 0);
    rows.sort((a, b) => {
      if (b.points !== a.points) return b.points - a.points;
      if (b.wins_season !== a.wins_season) return b.wins_season - a.wins_season;
      return String(a.full_name).localeCompare(String(b.full_name));
    });
    return rows;
  },
  async fighterPoints(fighterId, season) {
    const { data } = await pfSupabase.from("pf_results").select("points").eq("fighter_id", fighterId).eq("season", season || PF_SEASON);
    return (data || []).reduce((sum, r) => sum + r.points, 0);
  },
  async countFighters() {
    const { count } = await pfSupabase.from("pf_fighters").select("*", { count: "exact", head: true });
    return count || 0;
  },
  async countEvents() {
    const { count } = await pfSupabase.from("pf_events").select("*", { count: "exact", head: true });
    return count || 0;
  },
};

// ---------------------------------------------------------------------------
// Photo handling — client-side canvas resize replaces server-side sharp.
// ---------------------------------------------------------------------------
const PF_ALLOWED_PHOTO_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);

function pfResizeImageToBlob(file, maxDim = 1400, quality = 0.88) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        if (width >= height) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else { width = Math.round((width * maxDim) / height); height = maxDim; }
      }
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("Could not process image."))), "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Could not read that image file.")); };
    img.src = url;
  });
}

async function pfUploadPhoto(objectPath, blob) {
  const { error } = await pfSupabase.storage.from(PF_BUCKET).upload(objectPath, blob, {
    contentType: "image/jpeg", upsert: true, cacheControl: "300",
  });
  if (error) throw error;
  const { data } = pfSupabase.storage.from(PF_BUCKET).getPublicUrl(objectPath);
  return `${data.publicUrl}?v=${Date.now()}`;
}

async function pfSaveFighterPhoto(fighterId, file) {
  const blob = await pfResizeImageToBlob(file, 1400, 0.88);
  return pfUploadPhoto(`fighters/fighter-${fighterId}.jpg`, blob);
}

async function pfSaveEventPhoto(eventId, file) {
  const blob = await pfResizeImageToBlob(file, 1600, 0.86);
  return pfUploadPhoto(`events/event-${eventId}.jpg`, blob);
}

// Bio builder (mirrors lib/bio.mjs)
// ---------------------------------------------------------------------------
function pfBuildBio(fighter, division) {
  const bits = [];
  bits.push(`${pfEscape(fighter.full_name)} trains out of ${pfEscape(fighter.gym_name)} in ${pfEscape(fighter.gym_town)}, coached by ${pfEscape(fighter.coach_name)}.`);
  const record = `${fighter.wins || 0}-${fighter.losses || 0}-${fighter.draws || 0}`;
  bits.push(`Official record: ${record}${fighter.ko_tko_wins ? ` (${fighter.ko_tko_wins} by KO/TKO)` : ""}.`);
  if (division) bits.push(`Competes as a${fighter.boxer_type === "amateur" ? "n" : ""} ${pfEscape(fighter.boxer_type)} in the ${pfEscape(division.label)} division.`);
  if (fighter.has_title) {
    const status = fighter.title_current ? "current" : "former";
    const region = fighter.title_level === "regional" && fighter.title_region ? ` (${pfEscape(fighter.title_region)})` : "";
    bits.push(`${status === "current" ? "Currently holds" : "Formerly held"} a ${pfEscape(fighter.title_level)}${region} title.`);
  }
  return bits.join(" ");
}

function pfInitials(nameOrEmail) {
  const src = (nameOrEmail || "").trim();
  if (!src) return "?";
  const parts = src.split(/\s+/).filter(Boolean);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return src.slice(0, 2).toUpperCase();
}

    const preview = document.getElementById("pf-photo-preview");
    if (!file || !preview) return;
    const reader = new FileReader();
    reader.onload = (ev) => { preview.src = ev.target.result; preview.style.display = "block"; };
    reader.readAsDataURL(file);
  });
  document.querySelectorAll('input[name="has_title"]').forEach((r) => r.addEventListener("change", () => {
    const checked = document.querySelector('input[name="has_title"]:checked');
    document.getElementById("pf-title-details").style.display = checked && checked.value === "yes" ? "block" : "none";
  }));
  document.querySelectorAll('input[name="boxer_type"]').forEach((r) => r.addEventListener("change", async () => {
    const type = document.querySelector('input[name="boxer_type"]:checked').value;
    const list = (await pfDb.weightDivisions(type)) || [];
    document.getElementById("pf-weight-select").innerHTML = list.map((d) => `<option value="${d.id}">${pfEscape(d.label)}</option>`).join("");
  }));
}

const PF_ROUTES = [
  [/^\/$/, () => pfViewHome()],
  [/^\/signup$/, () => { if (pfState.user) { location.hash = "#/me"; return; } pfSetBody(pfSignupPage()); }],
  [/^\/login$/, () => { if (pfState.user) { location.hash = "#/me"; return; } pfSetBody(pfLoginPage()); }],
  [/^\/me$/, () => { if (!pfRequireLogin()) return; if (!pfState.fighter) { location.hash = "#/register"; return; } location.hash = `#/fighters/${pfState.fighter.id}`; }],
  [/^\/register$/, () => pfViewRegister()],
  [/^\/fighters$/, () => pfViewFighterProfiles()],
  [/^\/fighters\/(\d+)$/, (m) => pfViewFighterProfile(Number(m[1]))],
  [/^\/events$/, () => pfViewEventsList()],
  [/^\/events\/new$/, () => pfViewEventForm()],
  [/^\/events\/(\d+)$/, (m) => pfViewEventDetail(Number(m[1]))],
  [/^\/offers$/, () => pfViewOffers()],
  [/^\/matching-pool$/, () => pfViewOffers()], // legacy alias
  [/^\/confirmed$/, () => pfViewConfirmed()],
  [/^\/points$/, () => pfViewPoints()],
  [/^\/matchmaking$/, () => pfViewMatchmaking()],
];

// Any signed-in user without a fighter profile yet gets bounced to
// registration no matter what link/tab they try to open — first login must
// end in a completed Fight Club profile before anything else is browsable.
const PF_PROFILE_GATE_EXEMPT = new Set(["/register", "/signup", "/login"]);

function pfRoute() {
  const path = location.hash.replace(/^#/, "") || "/";
  if (pfState.user && !pfState.fighter && !PF_PROFILE_GATE_EXEMPT.has(path)) {
    location.hash = "#/register";
    return;
  }
  for (const [pattern, handler] of PF_ROUTES) {
    const m = path.match(pattern);
    if (m) { handler(m); pfRenderNav(); return; }
  }
  pfSetBody(`<div class="empty-state"><h2>Page not found</h2><a href="#/" data-link>Back home</a></div>`);
}

window.addEventListener("hashchange", pfRoute);

// Event delegation: forms + data-action buttons
// ---------------------------------------------------------------------------
function pfFormError(form, message) {
  let el = form.querySelector(".flash");
  if (!el) { el = document.createElement("div"); el.className = "flash flash-error"; form.prepend(el); }
  el.textContent = message;
}

document.addEventListener("submit", async (e) => {
  const form = e.target.closest("form[data-form]");
  if (!form) return;
  e.preventDefault();
  const kind = form.getAttribute("data-form");
  const fd = new FormData(form);
  const submitBtn = form.querySelector('button[type="submit"]');
  const originalLabel = submitBtn ? submitBtn.textContent : "";
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = "Please wait…"; }

  try {
    if (kind === "signup") {
      const email = String(fd.get("email") || "").trim().toLowerCase();
      const password = String(fd.get("password") || "");
      const password2 = String(fd.get("password2") || "");
      if (password !== password2) throw new Error("Passwords do not match.");
      const { error } = await pfSupabase.auth.signUp({ email, password });
      if (error) throw error;
      location.hash = "#/register";
    } else if (kind === "login") {
      const email = String(fd.get("email") || "").trim().toLowerCase();
      const password = String(fd.get("password") || "");
      const { error } = await pfSupabase.auth.signInWithPassword({ email, password });
      if (error) throw new Error("Incorrect email or password.");
      location.hash = "#/me";
    } else if (kind === "register") {
      const record = {
        full_name: String(fd.get("full_name") || "").trim(),
        gym_name: String(fd.get("gym_name") || "").trim(),
        coach_name: String(fd.get("coach_name") || "").trim(),
        gym_town: String(fd.get("gym_town") || "").trim(),
        gym_postcode: String(fd.get("gym_postcode") || "").trim(),
        boxer_type: String(fd.get("boxer_type") || "amateur"),
        weight_division_id: Number(fd.get("weight_division_id")),
        wins: Number(fd.get("wins")) || 0,
        losses: Number(fd.get("losses")) || 0,
        draws: Number(fd.get("draws")) || 0,
        exhibition_bouts: Number(fd.get("exhibition_bouts")) || 0,
        ko_tko_wins: Number(fd.get("ko_tko_wins")) || 0,
        has_title: fd.get("has_title") === "yes",
        title_level: fd.get("has_title") === "yes" ? fd.get("title_level") : null,
        title_region: null,
        title_current: fd.get("has_title") === "yes" && fd.get("title_current") === "current",
        availability: fd.get("availability") || "open",
      };
      if (!/^\d{4}$/.test(record.gym_postcode)) throw new Error("Gym postcode must be a 4-digit number.");
      const existingId = form.getAttribute("data-fighter-id");
      const photoFile = fd.get("photo");
      let fighterId;
      if (existingId) {
        fighterId = Number(existingId);
        await pfDb.updateFighter(fighterId, record);
      } else {
        fighterId = await pfDb.createFighter(pfState.user.id, record);
      }
      if (photoFile && photoFile.size > 0) {
        if (!PF_ALLOWED_PHOTO_TYPES.has(photoFile.type)) throw new Error("Photo must be a JPEG, PNG or WEBP image.");
        const url = await pfSaveFighterPhoto(fighterId, photoFile);
        await pfDb.setFighterPhoto(fighterId, url);
      }
      await pfRefreshSession();
      location.hash = `#/fighters/${fighterId}`;
    } else if (kind === "event") {
      const title = String(fd.get("title") || "").trim();
      const eventType = String(fd.get("event_type") || "");
      if (!PF_EVENT_TYPES.includes(eventType)) throw new Error("Please choose a valid night type.");
      const photoFile = fd.get("photo");
      if (!photoFile || photoFile.size === 0) throw new Error("Please upload a photo or poster for the event.");
      if (!PF_ALLOWED_PHOTO_TYPES.has(photoFile.type)) throw new Error("Event photo must be a JPEG, PNG or WEBP image.");
      const eventId = await pfDb.createEvent({
        title, location: String(fd.get("location") || "").trim(), venue: String(fd.get("venue") || "").trim() || null,
        event_date: String(fd.get("event_date") || ""), event_type: eventType,
        description: String(fd.get("description") || "").trim() || null, created_by: pfState.user.id,
      });
      const url = await pfSaveEventPhoto(eventId, photoFile);
      await pfDb.setEventPhoto(eventId, url);
      location.hash = `#/events/${eventId}`;
    } else if (kind === "nominate") {
      if (!pfState.fighter) throw new Error("Register a fighter profile first.");
      await pfDb.nominate(Number(form.getAttribute("data-event-id")), pfState.fighter.id);
      location.hash = "#/offers";
    } else if (kind === "withdraw") {
      if (pfState.fighter) await pfDb.withdrawNomination(Number(form.getAttribute("data-event-id")), pfState.fighter.id);
      pfRoute();
    } else if (kind === "matchmaking") {
      const aId = Number(fd.get("fighter_a_id")), bId = Number(fd.get("fighter_b_id"));
      if (!aId || !bId) throw new Error("Please pick two valid fighters.");
      if (aId === bId) throw new Error("A fighter can't be matched against themselves.");
      await pfDb.createMatch({
        fighter_a_id: aId, fighter_b_id: bId,
        event_id: fd.get("event_id") ? Number(fd.get("event_id")) : null,
        agreed_weight: String(fd.get("agreed_weight") || "").trim(), note: String(fd.get("note") || "").trim(),
      });
      pfRoute();
    } else if (kind === "place") {
      await pfDb.placeMatchOnEvent(Number(form.getAttribute("data-match-id")), fd.get("event_id") ? Number(fd.get("event_id")) : null);
      pfRoute();
    } else if (kind === "confirm") {
      await pfDb.confirmMatch(Number(form.getAttribute("data-match-id")));
      pfRoute();
    } else if (kind === "cancel-match") {
      await pfDb.cancelMatch(Number(form.getAttribute("data-match-id")));
      pfRoute();
    } else if (kind === "result") {
      const winnerRaw = String(fd.get("winner_fighter_id") || "");
      await pfDb.recordMatchResult({
        matchId: Number(form.getAttribute("data-match-id")),
        winnerFighterId: winnerRaw === "draw" || winnerRaw === "" ? null : Number(winnerRaw),
        method: String(fd.get("method") || "Decision"),
        fotnFighterId: fd.get("fotn_fighter_id") ? Number(fd.get("fotn_fighter_id")) : null,
      });
      pfRoute();
    }
  } catch (err) {
    console.error(err);
    pfFormError(form, err.message || "Something went wrong. Please try again.");
    if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = originalLabel; }
  }
});

document.addEventListener("click", async (e) => {
  const link = e.target.closest("[data-link]");
  if (link) {
    // Native hash navigation via href="#/..." already works; nothing extra needed.
    const openMenu = document.getElementById("pf-profile-menu");
    if (openMenu) openMenu.classList.remove("open");
    return;
  }
  const actionBtn = e.target.closest("[data-action]");
  if (!actionBtn) {
    // Clicked outside the profile menu/button entirely: close it if open.
    if (!e.target.closest(".profile-corner")) {
      const openMenu = document.getElementById("pf-profile-menu");
      if (openMenu) openMenu.classList.remove("open");
    }
    return;
  }
  const action = actionBtn.getAttribute("data-action");
  if (action === "toggle-profile-menu") {
    const menu = document.getElementById("pf-profile-menu");
    if (menu) menu.classList.toggle("open");
    return;
  }
  if (action === "logout") {
    await pfSupabase.auth.signOut();
    location.hash = "#/";
    return;
  }
  if (action === "respond-match") {
    actionBtn.disabled = true;
    try {
      await pfDb.respondToMatch(Number(actionBtn.getAttribute("data-match-id")), actionBtn.getAttribute("data-response"));
      pfRoute();
    } catch (err) {
      console.error(err);
      alert(err.message || "Could not respond to that offer.");
      actionBtn.disabled = false;
    }
  }
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
(async function pfBoot() {
  await pfRefreshSession();
  pfState.ready = true;
  pfRenderNav();
  pfRoute();
})();
</script>
